[package]
name = "sdr-studio"
version = "0.2.19"
edition = "2021"
rust-version = "1.88"
license = "GPL-2.0-only"
description = "Modular SDR receiver for Linux with experimental DMR and P25 analysis"

[[example]]
name = "counter_plugin"
crate-type = ["cdylib"]

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
libloading = "0.8"
rustfft = "6.2"
serde = "1"
serde_json = "1"

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
strip = true
